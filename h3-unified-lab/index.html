<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CZ H3 统一工作流 · 节点外观模拟（Comfy 风格）</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --grid: #2a2a2a;
      --node: #353535;
      --node-head: #2b2b2b;
      --text: #ddd;
      --muted: #999;
      --border: #111;
      --cz: #4a90d9;
      --official: #7a7a7a;
      --slot-image: #64b5f6;
      --slot-audio: #ce93d8;
      --slot-string: #ffcc80;
      --slot-int: #a5d6a7;
      --slot-float: #81c784;
      --slot-bool: #ef9a9a;
      --slot-plan: #f48fb1;
      --slot-bundle: #80cbc4;
      --slot-model: #90caf9;
      --slot-video: #ffab91;
      --wire: #888;
      --accent: #5c9ded;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text);
      overflow: hidden;
    }
    .topbar {
      height: 44px; display: flex; align-items: center; gap: 16px;
      padding: 0 16px; background: #161616; border-bottom: 1px solid #000;
      z-index: 20; position: relative;
    }
    .topbar h1 { font-size: 14px; font-weight: 600; margin: 0; }
    .topbar .tag {
      font-size: 11px; color: #111; background: var(--accent);
      padding: 2px 8px; border-radius: 10px;
    }
    .topbar .hint { font-size: 12px; color: var(--muted); flex: 1; }
    .topbar button {
      background: #333; color: var(--text); border: 1px solid #555;
      border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12px;
    }
    .topbar button:hover { background: #444; }
    .topbar button.active { background: var(--accent); color: #111; border-color: var(--accent); }

    .workspace {
      display: grid;
      grid-template-columns: 1fr 340px;
      height: calc(100% - 44px);
    }
    .canvas-wrap {
      position: relative; overflow: auto;
      background:
        linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 24px 24px,
        linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 24px 24px,
        var(--bg);
    }
    .canvas {
      position: relative;
      width: 1600px; height: 900px;
      transform-origin: 0 0;
    }
    #wires {
      position: absolute; inset: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 1;
    }
    .wire { fill: none; stroke: var(--wire); stroke-width: 2.5; opacity: 0.85; }
    .wire.plan { stroke: var(--slot-plan); }
    .wire.bundle { stroke: var(--slot-bundle); }
    .wire.audio { stroke: var(--slot-audio); }
    .wire.string { stroke: var(--slot-string); }
    .wire.image { stroke: var(--slot-image); }

    .node {
      position: absolute; z-index: 2;
      min-width: 200px; max-width: 280px;
      background: var(--node);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,.45);
      user-select: none;
    }
    .node.wide { max-width: 520px; min-width: 480px; }
    .node.xl { max-width: 560px; min-width: 520px; }
    .nle-shell.readonly .nle-clip { cursor: default; }
    .nle-shell.readonly .nle-clip .edge { display: none; }
    .nle-shell.readonly .cut { cursor: default; pointer-events: none; }
    .executor-panel {
      margin: 4px 8px 0; padding: 6px 8px 8px;
      background: #121820; border: 1px solid #2a3548; border-radius: 4px;
    }
    .executor-panel .ro-badge {
      display: inline-block; font-size: 9px; padding: 1px 5px; margin-left: 4px;
      border-radius: 3px; background: #3a4558; color: #cde;
    }
    .exec-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; margin-top: 4px;
    }
    .exec-grid label { font-size: 10px; color: #9ab; display: block; }
    .exec-grid select, .exec-grid input {
      width: 100%; margin-top: 2px; background: #1a2230; border: 1px solid #3a4558;
      color: #eee; border-radius: 3px; padding: 3px 5px; font-size: 11px;
    }
    .picker-panel {
      margin: 4px 8px 0; padding: 6px 8px 8px;
      background: #121820; border: 1px solid #2a3548; border-radius: 4px;
      max-height: 420px; overflow: auto;
    }
    .pick-seg {
      margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid #243044;
    }
    .pick-seg:last-of-type { border-bottom: none; }
    .pick-seg-h {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 11px; color: #cde; margin-bottom: 4px;
    }
    .pick-seg-h small { color: #8ab; font-size: 10px; }
    .pick-cards {
      display: flex; gap: 6px; flex-wrap: wrap;
    }
    .pick-card {
      width: 96px; border: 1px solid #3a4a60; border-radius: 4px;
      background: #182030; cursor: pointer; overflow: hidden;
      position: relative;
    }
    .pick-card:hover { border-color: #5a8ad0; }
    .pick-card.on {
      border: 2px solid #6ab0ff;
      box-shadow: 0 0 0 1px #328bff66;
    }
    .pick-card .thumb {
      height: 54px;
      background-size: cover; background-position: center;
    }
    .pick-card .meta {
      padding: 3px 5px; font-size: 9px; color: #b8c8dc; line-height: 1.3;
    }
    .pick-card .tag {
      position: absolute; top: 3px; left: 3px;
      background: #0c1a33cc; color: #9ec8ff; border: 1px solid #5688ec88;
      font-size: 9px; padding: 0 4px; border-radius: 2px;
    }
    .pick-card .sel {
      position: absolute; top: 3px; right: 3px;
      font-size: 9px; background: #2e7d32; color: #c8e6c9;
      padding: 0 4px; border-radius: 2px; display: none;
    }
    .pick-card.on .sel { display: inline; }
    .pick-compare {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
      margin: 6px 0; padding: 6px; background: #0e141c; border-radius: 4px;
      border: 1px dashed #334;
    }
    .pick-compare .slot {
      min-height: 64px; border-radius: 3px; background: #1a2434;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: #8ab; background-size: cover; background-position: center;
    }
    .pick-final {
      font-size: 10px; color: #9ab; line-height: 1.45; margin: 4px 0 6px;
      font-variant-numeric: tabular-nums;
    }
    .node.selected {
      outline: 2px solid var(--accent);
      box-shadow: 0 0 0 1px var(--accent), 0 8px 24px rgba(0,0,0,.5);
    }
    .node-head {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px;
      background: var(--node-head);
      border-radius: 8px 8px 0 0;
      border-bottom: 1px solid #222;
      cursor: grab;
      font-size: 12px; font-weight: 600;
    }
    .node-head .dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .node.cz .node-head .dot { background: var(--cz); }
    .node.official .node-head .dot { background: var(--official); }
    .node.core .node-head { background: #1a3a5c; }
    .node-body { padding: 6px 0 8px; font-size: 11px; }
    .slot-row {
      display: grid; grid-template-columns: 1fr 1fr;
      min-height: 22px; align-items: center;
      padding: 1px 0; position: relative;
    }
    .slot-row.solo-in { grid-template-columns: 1fr; }
    .slot-row.solo-out { grid-template-columns: 1fr; justify-items: end; }
    .slot {
      display: flex; align-items: center; gap: 6px;
      padding: 0 10px; color: #ccc; white-space: nowrap;
    }
    .slot.out { justify-content: flex-end; }
    .port {
      width: 10px; height: 10px; border-radius: 50%;
      border: 1px solid #111; flex-shrink: 0;
      position: absolute; top: 50%; transform: translateY(-50%);
    }
    .slot.in .port { left: -5px; }
    .slot.out .port { right: -5px; }
    .port.IMAGE, .port.LATENT { background: var(--slot-image); }
    .port.AUDIO { background: var(--slot-audio); }
    .port.STRING { background: var(--slot-string); }
    .port.INT { background: var(--slot-int); }
    .port.FLOAT { background: var(--slot-float); }
    .port.BOOLEAN { background: var(--slot-bool); }
    .port.H3_SEGMENT_PLAN { background: var(--slot-plan); }
    .port.H3_MEDIA_BUNDLE { background: var(--slot-bundle); }
    .port.H3_PROMPT_PACK { background: #f8bbd0; }
    .port.MODEL { background: var(--slot-model); }
    .port.VIDEO { background: var(--slot-video); }

    .widget {
      margin: 4px 10px; padding: 4px 6px;
      background: #2a2a2a; border: 1px solid #1a1a1a; border-radius: 4px;
      font-size: 11px; color: #bbb;
    }
    .widget label { display: block; color: var(--muted); font-size: 10px; margin-bottom: 2px; }
    .widget select, .widget input, .widget textarea {
      width: 100%; background: #1f1f1f; border: 1px solid #333;
      color: #ddd; border-radius: 3px; padding: 3px 5px; font-size: 11px;
      font-family: inherit;
    }
    .widget textarea { min-height: 48px; resize: vertical; }
    .widget .row { display: flex; gap: 8px; align-items: center; }
    .widget .chk { display: flex; align-items: center; gap: 6px; }

    .director-panel {
      margin: 6px 10px; padding: 8px;
      background: #252525; border: 1px solid #3a4a5c; border-radius: 6px;
      font-size: 11px;
    }
    .director-panel .timeline {
      position: relative;
      height: 44px; border-radius: 0; margin: 0;
      background: #111720; border: none; overflow: hidden;
      cursor: crosshair;
    }
    .director-panel .timeline .bars {
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        90deg,
        #3d5a80 0 2px, transparent 2px 4px,
        #2d4a6a 4px 5px, transparent 5px 7px
      );
      opacity: 0.55;
    }
    .director-panel .cut {
      position: absolute; top: 0; bottom: 0; width: 2px;
      background: #f48fb1; z-index: 2;
      cursor: ew-resize;
    }
    .director-panel .cut .handle {
      position: absolute; top: 2px; left: -4px; width: 10px; height: 10px;
      background: #f48fb1; border-radius: 2px;
    }
    .director-panel .cut .label {
      position: absolute; bottom: 2px; left: 4px;
      font-size: 9px; color: #f8bbd0; white-space: nowrap;
      text-shadow: 0 0 3px #000;
    }
    .director-panel .playhead {
      position: absolute; top: 0; bottom: 0; width: 2px;
      background: #ff5a5a; z-index: 5;
      box-shadow: 0 0 4px rgba(255,90,90,.6);
      pointer-events: none;
    }
    .director-panel .seg-band {
      position: absolute; top: 0; bottom: 0; opacity: 0.12; z-index: 1;
    }
    /* TimelineDirector 风格多轨 */
    .nle-shell {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      border: 1px solid #272e3b;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 6px;
      background: #0e131a;
    }
    .nle-label {
      display: flex; align-items: center; padding: 0 8px;
      border-top: 1px solid #272e3b; color: #aab5c7; font-size: 10px;
      background: #141a22;
    }
    .nle-label.ruler { height: 22px; border-top: none; color: #6a7385; }
    .nle-label.video { height: 72px; }
    .nle-label.audio { height: 44px; color: #c0a36f; }
    .nle-lane {
      position: relative; border-top: 1px solid #262d3a;
      background:
        repeating-linear-gradient(90deg, transparent 0 39px, #1a2230 39px 40px);
    }
    .nle-lane.ruler {
      height: 22px; border-top: none; background: #121820;
      font-size: 9px; color: #6a7385;
    }
    .nle-lane.video { height: 72px; background-color: #10161f; }
    .nle-lane.audio { height: 44px; background-color: #111720; }
    .nle-ruler-tick {
      position: absolute; top: 3px; transform: translateX(-50%);
      pointer-events: none; white-space: nowrap;
    }
    .nle-clip {
      position: absolute; top: 6px; height: 60px; min-width: 12px;
      overflow: hidden; border: 1px solid #5688ec; border-radius: 4px;
      background: linear-gradient(180deg, #2a4a7a, #122038);
      cursor: grab; z-index: 2; user-select: none;
      box-shadow: 0 3px 10px #0008;
    }
    .nle-clip.selected {
      border: 2px solid #b9ddff;
      box-shadow: 0 0 0 2px #328bff99, 0 5px 14px #0009;
    }
    .nle-clip .thumb {
      position: absolute; inset: 0;
      background-size: cover; background-position: center; opacity: 0.5;
    }
    .nle-clip .shade {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, #0002, #061329cc);
    }
    .nle-clip .name {
      position: absolute; left: 8px; right: 28px; top: 6px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 10px; color: #e8f0ff; text-shadow: 0 1px 2px #000;
      pointer-events: none;
    }
    .nle-clip .meta {
      position: absolute; left: 8px; bottom: 5px;
      font-size: 9px; color: #c8d9f7; text-shadow: 0 1px 2px #000;
      pointer-events: none;
    }
    .nle-clip .ref-tag {
      position: absolute; right: 5px; top: 5px; z-index: 3;
      padding: 1px 4px; border-radius: 3px; font-size: 9px;
      background: #0c1a33cc; color: #9ec8ff; border: 1px solid #5688ec88;
      pointer-events: none;
    }
    .nle-clip .edge {
      position: absolute; top: 0; bottom: 0; width: 6px; z-index: 3;
      cursor: ew-resize; background: transparent;
    }
    .nle-clip .edge.left { left: 0; }
    .nle-clip .edge.right { right: 0; }
    .nle-clip .edge:hover { background: #b9ddff55; }
    .nle-playhead-full {
      position: absolute; top: 0; bottom: 0; width: 2px;
      background: #ff5a5a; z-index: 6; pointer-events: none;
      box-shadow: 0 0 6px #ff5a5aaa;
    }
    .nle-hint {
      font-size: 10px; color: #8ab; margin: 0 0 6px; line-height: 1.35;
    }
    .nle-clip-info {
      font-size: 10px; color: #9ab; margin: 0 0 6px;
      font-variant-numeric: tabular-nums;
    }
    .transport {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      margin-bottom: 6px; font-size: 10px; color: #aaa;
    }
    .transport button {
      background: #3a3a3a; border: 1px solid #555; color: #eee;
      border-radius: 3px; padding: 3px 8px; font-size: 10px; cursor: pointer;
    }
    .transport button:hover { background: #4a90d9; border-color: #4a90d9; }
    .transport .time { font-variant-numeric: tabular-nums; min-width: 72px; }
    .seg-tabs { display: flex; gap: 4px; margin-bottom: 6px; flex-wrap: wrap; }
    .seg-tabs button {
      background: #333; border: 1px solid #444; color: #ccc;
      border-radius: 3px; padding: 2px 8px; font-size: 10px; cursor: pointer;
    }
    .seg-tabs button.on { background: #4a90d9; color: #fff; border-color: #4a90d9; }
    .mini-btns { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .mini-btns button {
      background: #3a3a3a; border: 1px solid #555; color: #ddd;
      border-radius: 3px; padding: 3px 7px; font-size: 10px; cursor: pointer;
    }
    .mini-btns button:hover { background: #4a90d9; border-color: #4a90d9; }
    .mini-btns button.primary { background: #2e5a8a; border-color: #4a90d9; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip {
      background: #333; border: 1px solid #555; color: #ccc;
      border-radius: 4px; padding: 4px 8px; font-size: 10px; cursor: pointer;
      line-height: 1.25; text-align: center;
    }
    .chip small { display: block; color: #888; font-size: 9px; }
    .chip.on { background: #1a4a7a; border-color: #4a90d9; color: #fff; }
    .badge {
      display: inline-block; font-size: 9px; padding: 1px 5px;
      border-radius: 3px; margin-left: 4px; vertical-align: middle;
    }
    .badge.new { background: #2e7d32; color: #c8e6c9; }
    .badge.exist { background: #555; color: #ccc; }
    .badge.opt { background: #6a1b9a; color: #e1bee7; }

    .side {
      border-left: 1px solid #000; background: #1a1a1a;
      overflow: auto; padding: 12px 14px; font-size: 12px;
    }
    .side h2 { font-size: 13px; margin: 0 0 8px; }
    .side h3 { font-size: 12px; margin: 14px 0 6px; color: var(--accent); }
    .side p, .side li { color: #aaa; line-height: 1.45; margin: 0 0 6px; }
    .side ul { padding-left: 18px; margin: 0 0 8px; }
    .side .code {
      background: #111; border: 1px solid #333; border-radius: 4px;
      padding: 8px; font-family: Consolas, monospace; font-size: 10px;
      color: #cfc; white-space: pre-wrap; margin: 8px 0;
    }
    .legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
    .legend span {
      display: inline-flex; align-items: center; gap: 4px; font-size: 10px; color: #bbb;
    }
    .legend i {
      width: 8px; height: 8px; border-radius: 50%; display: inline-block;
    }
    .empty-sel { color: var(--muted); font-style: italic; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>CZ / H3 统一工作流</h1>
    <span class="tag">外观模拟 · 非真节点</span>
    <span class="hint">主路径：导演台 → 模型收集 → 段执行台 → 选片拼接 · 点击节点看说明</span>
    <button type="button" id="btnZoomOut">缩小</button>
    <button type="button" id="btnZoomIn">放大</button>
    <button type="button" id="btnResetView">复位</button>
  </div>
  <div class="workspace">
    <div class="canvas-wrap" id="canvasWrap">
      <div class="canvas" id="canvas" style="transform: scale(0.85)">
        <svg id="wires"></svg>
        <!-- nodes injected by JS -->
      </div>
    </div>
    <aside class="side" id="side">
      <h2>图例</h2>
      <div class="legend">
        <span><i style="background:var(--slot-image)"></i> IMAGE</span>
        <span><i style="background:var(--slot-audio)"></i> AUDIO</span>
        <span><i style="background:var(--slot-string)"></i> STRING</span>
        <span><i style="background:var(--slot-plan)"></i> PLAN</span>
        <span><i style="background:var(--slot-bundle)"></i> BUNDLE</span>
        <span><i style="background:var(--slot-video)"></i> VIDEO</span>
        <span><i style="background:var(--slot-bool)"></i> BOOL</span>
      </div>
      <p><span class="badge new">新建</span> 规划中的 CZ 节点 · <span class="badge exist">已有</span> 现成节点 · <span class="badge opt">可选</span></p>
      <div id="detail">
        <p class="empty-sel">点击画布上的节点，右侧显示输入 / 输出 / 参数说明。</p>
      </div>
    </aside>
  </div>

  <script>
    /** @typedef {{ id: string, title: string, category: string, kind: 'cz'|'official'|'core', badge: string, x: number, y: number, wide?: boolean, xl?: boolean, inputs: {name:string,type:string,optional?:boolean}[], outputs: {name:string,type:string,optional?:boolean}[], widgets?: any[], director?: boolean, executor?: boolean, picker?: boolean, desc: string, notes?: string[] }} NodeDef */

    /** @type {NodeDef[]} */
    const NODES = [
      {
        id: "n3",
        title: "H3 多段计划台（导演台）",
        category: "CZ/H3",
        kind: "core",
        badge: "new",
        x: 40, y: 40,
        wide: true,
        director: true,
        inputs: [
          { name: "library", type: "H3_MEDIA_LIBRARY" },
          { name: "llm_handle", type: "H3_MODEL_HANDLE", optional: true },
        ],
        outputs: [
          { name: "plan", type: "H3_SEGMENT_PLAN" },
          { name: "boundaries_json", type: "STRING" },
          { name: "active_segment_index", type: "INT" },
        ],
        widgets: [
          { type: "text", label: "project_name", value: "mv_demo" },
          { type: "note", text: "LLM：接上游 LLMModelLoader；前端认线读 widget（同 @），点润色时 CZ 起 llama-server · 不必 Queue" },
        ],
        desc: "N3。只做计划。润色复用 LLMModelLoader 句柄：前端不 Queue 也能读到选了哪套模型。",
        notes: [
          "上游 Load / N0：真 Comfy 完成；视频=画面 IMAGE+伴音",
          "自动切分 = 台内按钮",
          "llm_handle ← LLMModelLoader（配置不占显存）；原理同提示词框 @",
          "采样交给右侧 N8 段执行台",
        ],
      },
      {
        id: "llm_loader",
        title: "LLM 模型加载器",
        category: "CZ/LLM",
        kind: "existing",
        badge: "reuse",
        x: 40, y: 520,
        inputs: [],
        outputs: [
          { name: "模型句柄", type: "H3_MODEL_HANDLE" },
        ],
        widgets: [
          { type: "select", label: "基座GGUF", options: [
            "Qwen3.8-27B-Q4_K_M.gguf",
            "Qwen3-VL-8B-Instruct-Q4_K_M.gguf",
          ]},
          { type: "select", label: "mmproj文件", options: [
            "None",
            "mmproj-Qwen3.8-27B-F16.gguf",
          ]},
          { type: "select", label: "对话处理器", options: ["Qwen3.8", "Qwen3-VL", "None"] },
        ],

    function slotSide(list, side) {
      if (!list.length) return "";
      return list.map((s, i) => {
        const opt = s.optional ? " ?" : "";
        return `
          <div class="slot-row ${side === "in" ? "solo-in" : "solo-out"}" data-side="${side}" data-idx="${i}">
            <div class="slot ${side}">
              <span class="port ${s.type}" data-port="${side}-${i}"></span>
              <span>${s.name}${opt}</span>
            </div>
          </div>`;
      }).join("");
    }

    function renderNode(n) {
      const el = document.createElement("div");
      el.className = `node ${n.kind}${n.wide ? " wide" : ""}${n.xl ? " xl" : ""}${n.id === selectedId ? " selected" : ""}`;
      el.dataset.id = n.id;
      el.style.left = n.x + "px";
      el.style.top = n.y + "px";

      const maxRows = Math.max(n.inputs.length, n.outputs.length, 1);
      let rows = "";
      for (let i = 0; i < maxRows; i++) {
        const inn = n.inputs[i];
        const out = n.outputs[i];
        rows += `<div class="slot-row" data-row="${i}">`;
        if (inn) {
          rows += `<div class="slot in"><span class="port ${inn.type}" data-port="in-${i}"></span><span>${inn.name}${inn.optional ? " ?" : ""}</span></div>`;
        } else {
          rows += `<div></div>`;
        }
        if (out) {
          rows += `<div class="slot out"><span>${out.name}</span><span class="port ${out.type}" data-port="out-${i}"></span></div>`;
        } else {
          rows += `<div></div>`;
        }
        rows += `</div>`;
      }

      el.innerHTML = `
        <div class="node-head" data-drag>
          <span class="dot"></span>
          <span>${n.title}</span>
          ${badgeHtml(n.badge)}
        </div>
        <div class="node-body">
          ${rows}
          ${renderWidgets(n.widgets)}
          ${n.director ? directorHtml() : ""}
          ${n.executor ? executorHtml() : ""}
          ${n.picker ? pickerHtml() : ""}
        </div>`;
      return el;
    }

    function portCenter(nodeEl, side, idx) {
      const port = nodeEl.querySelector(`[data-port="${side}-${idx}"]`);
      if (!port) return null;
      const canvas = document.getElementById("canvas");
      const pr = port.getBoundingClientRect();
      const cr = canvas.getBoundingClientRect();
      return {
        x: (pr.left + pr.width / 2 - cr.left) / scale,
        y: (pr.top + pr.height / 2 - cr.top) / scale,
      };
    }

    function drawWires() {
      const svg = document.getElementById("wires");
      const canvas = document.getElementById("canvas");
      svg.setAttribute("width", canvas.offsetWidth);
      svg.setAttribute("height", canvas.offsetHeight);
      let paths = "";
      for (const [a, ai, b, bi, cls] of WIRES) {
        const na = canvas.querySelector(`.node[data-id="${a}"]`);
        const nb = canvas.querySelector(`.node[data-id="${b}"]`);
        if (!na || !nb) continue;
        const p0 = portCenter(na, "out", ai);
        const p1 = portCenter(nb, "in", bi);
        if (!p0 || !p1) continue;
        const dx = Math.max(40, Math.abs(p1.x - p0.x) * 0.4);
        const d = `M ${p0.x} ${p0.y} C ${p0.x + dx} ${p0.y}, ${p1.x - dx} ${p1.y}, ${p1.x} ${p1.y}`;
        paths += `<path class="wire ${cls || ""}" d="${d}" />`;
      }
      svg.innerHTML = paths;
    }

        <p>${n.desc}</p>
        <h3>分类</h3>

}</div>` : ""}
      `;

    function mount() {

      bindNodeEvents();
      requestAnimationFrame(drawWires);
      showDetail(selectedId);

    function bindNodeEvents() {
      document.querySelectorAll(".node").forEach((el) => {
        el.addEventListener("mousedown", (e) => {
          if (e.target.closest(".director-panel") || e.target.closest(".executor-panel") || e.target.closest(".picker-panel")) return;
          const id = el.dataset.id;
          selectedId = id;
          document.querySelectorAll(".node").forEach((n) => n.classList.toggle("selected", n.dataset.id === id));
          showDetail(id);

          if (!e.target.closest("[data-drag]") && !e.target.closest(".node-head")) return;
          const n = NODES.find((x) => x.id === id);
          drag = {
            id,
            ox: e.clientX,
            oy: e.clientY,
            sx: n.x,
            sy: n.y,
          };
          e.preventDefault();
        });
      });
      bindDirectorUI();
      bindExecutorUI();
      bindPickerUI();
    }

    function fmt(t) { return t.toFixed(1); }

    function snapTime(t, opts = {}) {
      if (!document.getElementById("chkSnap")?.checked) return t;
      let best = t, bd = 0.25;
      const marks = [0, DIR.duration];
      if (!opts.excludeCuts) marks.push(...DIR.cuts);
      for (const c of DIR.clips) {
        if (opts.excludeClipId && c.id === opts.excludeClipId) continue;
        marks.push(c.start, c.start + c.duration);
      }
      for (const m of marks) {
        const d = Math.abs(m - t);
        if (d < bd) { best = m; bd = d; }
      }
      return best;
    }

    function syncRuler() {
      const ruler = document.getElementById("dirRuler");
      if (!ruler) return;
      ruler.innerHTML = "";
      const step = DIR.duration <= 30 ? 1 : 2;
      for (let s = 0; s <= DIR.duration + 0.01; s += step) {
        const tick = document.createElement("span");
        tick.className = "nle-ruler-tick";
        tick.style.left = (s / DIR.duration) * 100 + "%";
        tick.textContent = s + "s";
        ruler.appendChild(tick);
      }
    }

    function syncVideoClips() {
      const lane = document.getElementById("dirVideoLane");
      const info = document.getElementById("dirClipInfo");
      if (!lane) return;
      let ph = document.getElementById("dirPlayheadVideo");
      lane.querySelectorAll(".nle-clip").forEach((el) => el.remove());
      for (const clip of DIR.clips) {
        const el = document.createElement("div");
        el.className = "nle-clip" + (clip.id === DIR.selectedClipId ? " selected" : "");
        el.dataset.id = clip.id;
        el.style.left = (clip.start / DIR.duration) * 100 + "%";
        el.style.width = (clip.duration / DIR.duration) * 100 + "%";
        el.innerHTML = `
          <div class="thumb" style="background:${clip.thumb}"></div>
          <div class="shade"></div>
          <div class="name">${clip.name}</div>
          <div class="meta">${fmt(clip.start)}–${fmt(clip.start + clip.duration)}s · ${fmt(clip.duration)}s</div>
          <div class="ref-tag">${clip.ref}</div>
          <div class="edge left" data-edge="left"></div>
          <div class="edge right" data-edge="right"></div>`;
        lane.appendChild(el);
      }
      if (!ph) {
        ph = document.createElement("div");
        ph.className = "nle-playhead-full";

        lane.appendChild(ph);
      } else {

      ph.style.left = (DIR.t / DIR.duration) * 100 + "%";
      const sel = DIR.clips.find((c) => c.id === DIR.selectedClipId);
      if (info) {
        info.textContent = sel
          ? `选中 ${sel.name}（${sel.ref}）· ${fmt(sel.start)}–${fmt(sel.start + sel.duration)}s · 拖中间移动，拖左右边裁剪`

    function findPickVersion(vid) {
      for (let si = 0; si < PICK.segs.length; si++) {
        const v = PICK.segs[si].versions.find((x) => x.id === vid);
        if (v) return { seg: si, v };
      }
      return null;
    }

    function syncPickerVisual() {
      const list = document.getElementById("pickSegList");
      const finalLine = document.getElementById("pickFinalLine");
      if (!list) return;
      list.innerHTML = "";
      PICK.segs.forEach((seg, si) => {
        const block = document.createElement("div");
        block.className = "pick-seg";
        const chosen = seg.versions.find((v) => v.id === seg.selected);
        block.innerHTML = `<div class="pick-seg-h"><span>段${si}</span><small>成片用 ${chosen ? chosen.label : "—"}</small></div>`;
        const cards = document.createElement("div");
        cards.className = "pick-cards";
        seg.versions.forEach((v) => {
          const card = document.createElement("div");
          card.className = "pick-card" + (v.id === seg.selected ? " on" : "");
          card.dataset.vid = v.id;
          card.dataset.seg = String(si);
          const inCmp = PICK.compare.some((c) => c.vid === v.id);
          card.innerHTML = `
            <div class="thumb" style="background:${v.thumb}"></div>
            <span class="tag">${v.label}</span>
            <span class="sel">成片</span>
            <div class="meta">${v.backbone}<br>seed ${v.seed}${inCmp ? "<br>·对比中" : ""}</div>`;

            e.stopPropagation();
            if (e.shiftKey || e.ctrlKey || e.metaKey) {
              // toggle compare (max 2, prefer same seg)
              const idx = PICK.compare.findIndex((c) => c.vid === v.id);
              if (idx >= 0) PICK.compare.splice(idx, 1);
              else {
                if (PICK.compare.length >= 2) PICK.compare.shift();
                PICK.compare.push({ seg: si, vid: v.id });
              }
            } else {
              seg.selected = v.id;
            }
            syncPickerVisual();
          });
          cards.appendChild(card);
        });
        block.appendChild(cards);
        list.appendChild(block);

      const a = document.getElementById("cmpA");

        el.style.backgroundImage = hit.v.thumb;
        el.textContent = `段${hit.seg} ${hit.v.label}`;

      paint(b, 1);

          return `段${si}→${v ? v.label : "?"}`;
        }).join("  ·  ") + "  →  成片";
      }
    }

    function bindDirectorUI() {
      const btnPlay = document.getElementById("btnPlay");
      const btnStop = document.getElementById("btnStop");
      const btnAuto = document.getElementById("btnAutoSplit");
      const tl = document.getElementById("dirTimeline");
      const videoLane = document.getElementById("dirVideoLane");
      if (!btnPlay || !tl) return;

      btnPlay.onclick = (e) => {
        e.stopPropagation();
        if (DIR.playing) {
          DIR.playing = false;
          btnPlay.textContent = "▶ 试听";
          cancelAnimationFrame(DIR.raf);
          return;
        }
        DIR.playing = true;
        btnPlay.textContent = "❚❚ 暂停";
        DIR.lastTs = performance.now();
        const tick = (ts) => {
          if (!DIR.playing) return;
          const dt = (ts - DIR.lastTs) / 1000;
          DIR.lastTs = ts;
          DIR.t += dt;
          if (DIR.t >= DIR.duration) {
            DIR.t = DIR.duration;
            DIR.playing = false;
            btnPlay.textContent = "▶ 试听";
            syncDirectorVisual();
            return;
          }
          syncDirectorVisual();
          DIR.raf = requestAnimationFrame(tick);
        };
        DIR.raf = requestAnimationFrame(tick);
      };
      btnStop.onclick = (e) => {
        e.stopPropagation();
        DIR.playing = false;
        DIR.t = 0;
        btnPlay.textContent = "▶ 试听";
        cancelAnimationFrame(DIR.raf);
        syncDirectorVisual();
      };
      document.getElementById("btnNudgeL").onclick = (e) => {
        e.stopPropagation();
        if (DIR.activeCut < 0 || DIR.activeCut >= DIR.cuts.length) return;
        DIR.cuts[DIR.activeCut] = Math.max(0.2, DIR.cuts[DIR.activeCut] - 0.1);
        DIR.cuts.sort((a, b) => a - b);
        syncDirectorVisual();
      };
      document.getElementById("btnNudgeR").onclick = (e) => {
        e.stopPropagation();
        if (DIR.activeCut < 0 || DIR.activeCut >= DIR.cuts.length) return;
        DIR.cuts[DIR.activeCut] = Math.min(DIR.duration - 0.2, DIR.cuts[DIR.activeCut] + 0.1);

        syncDirectorVisual();
      };

        e.stopPropagation();

        DIR.cuts = [7, 14];
        DIR.t = 0;

      document.getElementById("btnAddCut").onclick = (e) => {
        e.stopPropagation();
        const t = Math.round(DIR.t * 10) / 10;
        if (t > 0.2 && t < DIR.duration - 0.2 && !DIR.cuts.some((c) => Math.abs(c - t) < 0.15)) {
          DIR.cuts.push(t);
          DIR.cuts.sort((a, b) => a - b);
          DIR.activeCut = DIR.cuts.indexOf(t);
          syncDirectorVisual();
        }
      };
      document.getElementById("btnDelCut").onclick = (e) => {
        e.stopPropagation();
        if (DIR.cuts.length && DIR.activeCut >= 0) {
          DIR.cuts.splice(DIR.activeCut, 1);
          DIR.activeCut = Math.max(0, DIR.activeCut - 1);
          syncDirectorVisual();
        }
      };

      const timeFromClientX = (clientX, el) => {
        const rect = el.getBoundingClientRect();
        return ((clientX - rect.left) / rect.width) * DIR.duration;
      };

      tl.onmousedown = (e) => {
        e.stopPropagation();
        e.preventDefault();
        const cutEl = e.target.closest(".cut");
        if (cutEl) {
          DIR.activeCut = [...tl.querySelectorAll(".cut")].indexOf(cutEl);
          DIR.drag = { type: "cut", index: DIR.activeCut };
          syncDirectorVisual();
          return;
        }
        DIR.t = Math.max(0, Math.min(DIR.duration, timeFromClientX(e.clientX, tl)));
        DIR.t = snapTime(DIR.t);
        syncDirectorVisual();
      };

      if (videoLane) {
        videoLane.onmousedown = (e) => {
          e.stopPropagation();
          e.preventDefault();
          const clipEl = e.target.closest(".nle-clip");
          if (!clipEl) {
            DIR.t = Math.max(0, Math.min(DIR.duration, timeFromClientX(e.clientX, videoLane)));
            DIR.t = snapTime(DIR.t);
            syncDirectorVisual();
            return;
          }
          const clip = DIR.clips.find((c) => c.id === clipEl.dataset.id);
          if (!clip) return;
          DIR.selectedClipId = clip.id;
          const edge = e.target.closest("[data-edge]")?.dataset.edge || "move";
          DIR.drag = {
            type: "clip",
            edge,
            id: clip.id,
            ox: e.clientX,
            ot: clip.start,
            odur: clip.duration,
            laneW: videoLane.getBoundingClientRect().width,
          };
          syncDirectorVisual();
        };
      }

      if (!DIR.winBound) {
        DIR.winBound = true;
        window.addEventListener("mousemove", (e) => {
          if (!DIR.drag) return;
          if (DIR.drag.type === "cut") {
            const audioTl = document.getElementById("dirTimeline");
            const rect = audioTl?.getBoundingClientRect();
            if (!rect) return;
            let t = ((e.clientX - rect.left) / rect.width) * DIR.duration;
            t = Math.max(0.2, Math.min(DIR.duration - 0.2, t));
            t = Math.round(snapTime(t, { excludeCuts: true }) * 10) / 10;
            DIR.cuts[DIR.drag.index] = t;
            DIR.cuts.sort((a, b) => a - b);
            DIR.activeCut = DIR.cuts.indexOf(t);
            syncDirectorVisual();
            return;
          }
          if (DIR.drag.type === "clip") {
            const clip = DIR.clips.find((c) => c.id === DIR.drag.id);
            if (!clip) return;
            const dxSec = ((e.clientX - DIR.drag.ox) / Math.max(1, DIR.drag.laneW)) * DIR.duration;
            const minDur = 0.5;
            const snapOpts = { excludeClipId: clip.id };
            if (DIR.drag.edge === "move") {
              let start = DIR.drag.ot + dxSec;
              start = Math.max(0, Math.min(DIR.duration - clip.duration, start));
              const snappedStart = snapTime(start, snapOpts);
              const snappedByEnd = snapTime(start + clip.duration, snapOpts) - clip.duration;
              start = Math.abs(snappedStart - start) <= Math.abs(snappedByEnd - start)
                ? snappedStart : snappedByEnd;
              clip.start = Math.round(Math.max(0, Math.min(DIR.duration - clip.duration, start)) * 10) / 10;
            } else if (DIR.drag.edge === "left") {
              const end = DIR.drag.ot + DIR.drag.odur;
              let start = snapTime(DIR.drag.ot + dxSec, snapOpts);
              start = Math.max(0, Math.min(end - minDur, start));
              clip.start = Math.round(start * 10) / 10;
              clip.duration = Math.round((end - clip.start) * 10) / 10;
            } else if (DIR.drag.edge === "right") {
              let end = snapTime(DIR.drag.ot + DIR.drag.odur + dxSec, snapOpts);
              end = Math.max(clip.start + minDur, Math.min(DIR.duration, end));
              clip.duration = Math.round((end - clip.start) * 10) / 10;
            }
            syncDirectorVisual();
          }
        });
        window.addEventListener("mouseup", () => { DIR.drag = null; });
      }

      // 底模族 / 玩法卡片切换（示意）
      const family = document.getElementById("familyChips");
      const baseBox = document.getElementById("baseModes");
      const refBox = document.getElementById("refIntents");
      const summary = document.getElementById("intentSummary");
      const labels = {
        ref: "普通参考生", lip: "对口型", swap: "换人", vedit: "视频编辑",
        cont: "视频续拍", kf: "关键帧", aud: "音频参考",
      };
      const syncFamily = () => {
        const on = family.querySelector(".chip.on")?.dataset.f || "auto";
        if (baseBox) baseBox.style.display = on === "ref" ? "none" : "block";
        if (refBox) refBox.style.display = on === "base" ? "none" : "block";
        if (on === "auto" && summary) summary.textContent = "自动（按本段轨道素材推断）";
        if (on === "base" && summary) summary.textContent = "Base 族";
        if (on === "ref") updateIntentSummary();
      };
      const updateIntentSummary = () => {
        if (!refBox || !summary) return;
        const picked = [...refBox.querySelectorAll(".chip.on")].map((c) => labels[c.dataset.i] || c.textContent);
        summary.textContent = picked.length ? "Ref · " + picked.join(" + ") : "Ref · （未选玩法）";
      };
      family?.querySelectorAll(".chip").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          family.querySelectorAll(".chip").forEach((c) => c.classList.remove("on"));
          btn.classList.add("on");
          syncFamily();
        });
      });
      baseBox?.querySelectorAll(".chip").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          baseBox.querySelectorAll(".chip").forEach((c) => c.classList.remove("on"));
          btn.classList.add("on");
        });
      });
      refBox?.querySelectorAll(".chip").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          btn.classList.toggle("on");
          updateIntentSummary();
        });
      });
      syncFamily();

      syncDirectorVisual();
    }

    window.addEventListener("mousemove", (e) => {
      if (!drag) return;
      const n = NODES.find((x) => x.id === drag.id);
      n.x = drag.sx + (e.clientX - drag.ox) / scale;
      n.y = drag.sy + (e.clientY - drag.oy) / scale;
      const el = document.querySelector(`.node[data-id="${drag.id}"]`);
      el.style.left = n.x + "px";
      el.style.top = n.y + "px";
      drawWires();
    });
    window.addEventListener("mouseup", () => { drag = null; });
    window.addEventListener("resize", () => drawWires());

    function setScale(s) {
      scale = Math.min(1.2, Math.max(0.5, s));
      document.getElementById("canvas").style.transform = `scale(${scale})`;
      requestAnimationFrame(drawWires);
    }
    document.getElementById("btnZoomIn").onclick = () => setScale(scale + 0.1);
    document.getElementById("btnZoomOut").onclick = () => setScale(scale - 0.1);
    document.getElementById("btnResetView").onclick = () => {
      setScale(0.85);
      document.getElementById("canvasWrap").scrollLeft = 0;
      document.getElementById("canvasWrap").scrollTop = 0;
    };

    mount();
  </script>
</body>
</html>
